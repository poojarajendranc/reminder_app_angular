<div class="app-shell" [class.sidebar-collapsed]="isSidebarCollapsed">


  <!-- Mobile backdrop -->
  @if (isSidebarOpen) {
  <div class="sidebar-backdrop" (click)="closeSidebar()"></div>
  }

  <!-- Sidebar -->
  <aside class="sidebar" [class.sidebar-open]="isSidebarOpen">

    <div class="brand">
      <div class="brand-icon">R</div>
      <span>Reminder<span class="brand-highlight">App</span></span>
    </div>

    <div class="nav-section">
      <span class="nav-label">WORKSPACE</span>

      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"
        (click)="closeSidebar()">
        <span class="nav-icon">◫</span>
        Dashboard
      </a>

      <a routerLink="/events" routerLinkActive="active" (click)="closeSidebar()">
        <span class="nav-icon">▤</span>
        My Events
      </a>

      <a routerLink="/calendar" routerLinkActive="active" (click)="closeSidebar()">
        <span class="nav-icon">▦</span>
        Calendar
      </a>
    </div>

    <div class="nav-section">
      <span class="nav-label">PREFERENCES</span>

      <a routerLink="/settings" routerLinkActive="active" (click)="closeSidebar()">
        <span class="nav-icon">⚙</span>
        Settings
      </a>
    </div>

    <div class="sidebar-bottom">
      <div class="user-profile">
        <div class="avatar">U</div>
        <div class="user-info">
          <strong>My Account</strong>
          <small>Reminder User</small>
        </div>
      </div>

      <button class="logout-button" (click)="onLogout()">
        <span class="nav-icon">↪</span>
        Logout
      </button>
    </div>

  </aside>

  <!-- Main area -->
  <div class="main-area">

    <header class="topbar">
      <!-- <button type="button" class="menu-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        ☰
      </button> -->


      <div class="topbar-title">
        <span>ReminderApp</span>
        <small>Stay organized. Never forget.</small>
      </div>

      <div class="topbar-right">
        <span class="status-dot"></span>
        <span>Personal Workspace</span>
      </div>
    </header>

    <main class="page-content">
      <router-outlet />
    </main>

  </div>

</div>
